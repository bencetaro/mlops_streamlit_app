apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
  namespace: webapp-demo
  labels:
    app: streamlit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit
  template:
    metadata:
      labels:
        app: streamlit
    spec:
      containers:
        - name: streamlit
          image: webapp-demo-app:latest
          ports:
            - containerPort: 8501
          env:
            - name: PYTHONUNBUFFERED
              value: "1"

---
apiVersion: v1
kind: Service
metadata:
  name: streamlit
  namespace: webapp-demo
  labels:
    app: streamlit
spec:
  type: NodePort
  selector:
    app: streamlit
  ports:
    - name: http
      port: 8501
      targetPort: 8501
