apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: webapp-demo
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: saze21/webapp-demo-api:v1.1
          ports:
            - containerPort: 8000
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: output
              mountPath: /app/output
              readOnly: true
      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: output-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: webapp-demo
  labels:
    app: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
